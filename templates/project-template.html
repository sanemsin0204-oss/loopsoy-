<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Template | Loopsoy</title>
<meta name="description" content="Template page for adding a new crochet project to Loopsoy.">
<link rel="stylesheet" href="../style.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<div id="site-header"></div>

<main id="main">
  <div class="container">
    <div style="padding-top:28px;">
      <a class="back-link" href="projects.html">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M14 8H3M7 4L3 8l4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        All projects
      </a>
    </div>

    <article>
      <div class="project-hero">
        <div class="photo">
          <img src="../images/logo.png" alt="Project preview" width="1200" height="1200" loading="eager">
        </div>
        <div class="project-info">
          <span class="eyebrow">Category</span>
          <h1>Project title</h1>
          <div class="pill-row">
            <span class="pill"><span class="dot" style="background:#A9C6DC"></span>Dusty blue</span>
            <span class="pill"><span class="dot" style="background:#F5E9DC; box-shadow: inset 0 0 0 1px #d8c9b8;"></span>Cream white</span>
            <span class="pill">4.5mm hook</span>
          </div>
          <p class="desc">Write a short description of the project here.</p>
          <div style="text-align:center; margin-top:14px;">
            <a class="btn btn-primary" href="#tools">View supplies</a>
          </div>
        </div>
      </div>

      <svg class="yarn-divider" viewBox="0 0 300 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M4 20 C 60 -6, 100 46, 150 20 S 240 -6, 260 20" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" style="color:var(--mint-deep)"/>
      </svg>

      <section class="section" style="padding-top:32px;">
        <div class="pro-tip reveal">
          <span class="label">Pro tip</span>
          <p>Add your best tip for this project here.</p>
        </div>
      </section>

      <section class="section" id="tools" style="padding-top:0;">
        <div class="section-head" style="margin-bottom:28px;">
          <span class="eyebrow">Supplies I used</span>
          <h2>Tools &amp; Materials</h2>
          <p>List the exact items you used for this project.</p>
        </div>

        <div class="tools-grid" data-supplies='["Blue Acrylic Yarn","4.5mm Crochet Hook"]'></div>
      </section>
    </article>
  </div>
</main>

<div id="site-footer"></div>

<script src="../scripts.js"></script>
</body>
</html>
